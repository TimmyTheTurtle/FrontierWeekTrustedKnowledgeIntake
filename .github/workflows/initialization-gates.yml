# This workflow is a small, one-time learning example for repository issue #1.
# It demonstrates how GitHub can react to issue comments and pull requests,
# run a deterministic check, and write the result back to the issue.
# It is not a reusable issue-orchestration framework for future work.
# Issue: https://github.com/TimmyTheTurtle/FrontierWeekTrustedKnowledgeIntake/issues/1
#
# Beginner learning references:
# - Workflow syntax: https://docs.github.com/actions/using-workflows/workflow-syntax-for-github-actions
# - Workflow events: https://docs.github.com/actions/using-workflows/events-that-trigger-workflows
# - GitHub Script: https://github.com/actions/github-script
name: Repository initialization gates

# These events can start the workflow:
# - workflow_dispatch: a person manually seeds the existing issue.
# - issue_comment: a human approval comment unlocks the next checkpoint.
# - pull_request: a proposed change receives a scope check.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing initialization issue to seed
        required: true
        default: "1"
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  
# Give the workflow only the permissions it needs.
# Beginner reference: https://docs.github.com/actions/using-jobs/assigning-permissions-to-jobs
permissions:
  contents: read
  issues: write
  pull-requests: read

# Keep two runs for the same issue or pull request from racing each other.
# Beginner reference: https://docs.github.com/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: initialization-gates-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

# This is intentionally fixed to the existing initialization issue.
# A future task would need a separately designed workflow.
env:
  INITIALIZATION_ISSUE: "1"
  FINAL_PHASE_MARKER: "FINAL-PHASE: APPROVED"

jobs:
  # A manual run posts the first checkpoint because issue #1 existed before
  # this workflow was added.
  seed-initialization:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Seed the inspection checkpoint
        # github-script lets a workflow call the GitHub API with JavaScript.
        # Beginner reference: https://github.com/actions/github-script
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ inputs.issue_number }}');
            if (issueNumber !== Number(process.env.INITIALIZATION_ISSUE)) {
              core.setFailed(`This workflow is locked to issue #${process.env.INITIALIZATION_ISSUE}.`);
              return;
            }

            // A hidden marker lets us update one bot comment instead of
            // creating a duplicate every time the workflow is run.
            const marker = '<!-- initialization-gate:phase-0 -->';
            const body = `${marker}
            ## Initialization checkpoint 0: inspect and propose

            The coding agent may inspect the repository, read the referenced context, and post a bounded initialization plan.

            No files may be edited during this checkpoint.

            When the plan is ready, the agent must stop and wait for the human approval comment:

            APPROVE: PLAN

            This checkpoint is specific to repository initialization for issue #${issueNumber}.`;

            // Read the existing comments so the result is repeatable.
            // API reference: https://docs.github.com/rest/issues/comments
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

  # This job listens for the three exact approval phrases written in issue #1.
  # The issue author remains the human authority for advancing the work.
  approval-checkpoint:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.body == 'APPROVE: PLAN' ||
       github.event.comment.body == 'APPROVE: DOCUMENTATION' ||
       github.event.comment.body == 'APPROVE: SCAFFOLDING')
    runs-on: ubuntu-latest
    steps:
      - name: Advance the approved initialization checkpoint
        # Beginner reference for expressions used in the job filter:
        # https://docs.github.com/actions/learn-github-actions/expressions
        uses: actions/github-script@v7
        with:
          script: |
            const approval = context.payload.comment.body.trim();
            const issueAuthor = context.payload.issue.user.login;

            if (context.actor !== issueAuthor) {
              core.setFailed(`Only the issue author (${issueAuthor}) can approve a checkpoint.`);
              return;
            }

            const checkpoints = {
              'APPROVE: PLAN': {
                marker: '<!-- initialization-gate:phase-1 -->',
                body: `<!-- initialization-gate:phase-1 -->
                ## Initialization checkpoint 1 unlocked: documentation

                The plan is approved. The coding agent may now create or revise only the documentation and repository-contract files listed in issue #1.

                It must stop after that work and report:

                DOCUMENTATION READY — AWAITING HUMAN REVIEW

                The next human approval is APPROVE: DOCUMENTATION.`
              },
              'APPROVE: DOCUMENTATION': {
                marker: '<!-- initialization-gate:phase-2 -->',
                body: `<!-- initialization-gate:phase-2 -->
                ## Initialization checkpoint 2 unlocked: minimal scaffolding

                The documentation is approved. The coding agent may now add only the minimal schemas, types, deterministic helpers, validation, and focused tests authorized by issue #1.

                It must stop before deterministic Markdown ingestion and report:

                INITIALIZATION SCAFFOLDING READY — AWAITING HUMAN REVIEW

                The next human approval is APPROVE: SCAFFOLDING.`
              },
              'APPROVE: SCAFFOLDING': {
                marker: '<!-- initialization-gate:phase-3 -->',
                body: `<!-- initialization-gate:phase-3 -->
                ## Initialization checkpoint 3 unlocked: verify and report

                The minimal scaffolding is approved. The coding agent may run the repository's available checks and provide the final initialization report.

                It must not begin Stage 1 implementation. A human must review the final diff and verification report before issue #1 is considered complete.`
              }
            }[approval];

            // Use the same marker/update pattern for each checkpoint comment.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(checkpoints.marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: checkpoints.body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: checkpoints.body,
              });
            }

  # This job runs only for a pull request that appears related to issue #1.
  # It does not decide whether the design is good; it checks file-level scope.
  validate-initialization-pull-request:
    if: >-
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.title, 'initialization') ||
       contains(github.event.pull_request.body, '#1'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed change
        # fetch-depth: 0 makes the main branch available for comparison.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate initialization file scope
        # The Python script prints a Markdown report and returns a failing
        # exit code when the pull request leaves the initialization boundary.
        id: scope
        continue-on-error: true
        run: python scripts/validate_initialization_scope.py origin/main...HEAD > initialization-scope-report.md

      - name: Report the scope result on issue #1
        # The report is written back to the same persistent issue.
        uses: actions/github-script@v7
        env:
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('initialization-scope-report.md', 'utf8');
            const marker = '<!-- initialization-gate:pull-request-scope -->';
            const body = `${marker}
            ## Initialization pull request scope check

            Pull request #${context.payload.pull_request.number}: **${process.env.SCOPE_OUTCOME === 'success' ? 'passed' : 'requires review'}**

            ${report}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.INITIALIZATION_ISSUE),
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.INITIALIZATION_ISSUE),
                body,
              });
            }

      - name: Fail when the proposed change leaves initialization scope
        # continue-on-error above lets the workflow post the explanation first;
        # this step then makes the GitHub check fail when the scope is invalid.
        if: steps.scope.outcome == 'failure'
        run: exit 1

  block-premature-issue-closure:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body closing keywords vs final-phase marker
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const marker = process.env.FINAL_PHASE_MARKER;
  
            const hasClosingKeyword = /\b(?:fixe?[sd]?|close[sd]?|resolve[sd]?)\s+#\d+\b/i.test(body);
            const hasFinalMarker = body.includes(marker);
  
            if (hasClosingKeyword && !hasFinalMarker) {
              core.setFailed(
                `PR body contains issue-closing keyword(s) but is missing required marker "${marker}". ` +
                `Remove closing keywords (Fixes/Closes/Resolves) or add the final-phase marker only when final phase is actually approved.`
              );
            } else {
              core.info('Issue-closing keyword guard passed.');
            }

            
